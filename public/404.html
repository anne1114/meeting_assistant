<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Meeting Assistant</title>
    <script>
      (function () {
        var l = window.location;
        var origin = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '');
        l.replace(
          origin +
            '/?p=' +
            encodeURIComponent(l.pathname + l.search) +
            (l.hash ? '&h=' + encodeURIComponent(l.hash) : '')
        );
      })();
    </script>
  </head>
  <body></body>
</html>
